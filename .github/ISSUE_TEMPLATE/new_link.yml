name: Create New Short Link
description: Add a new redirect page
title: "[Link]: "
labels: ["short-link"]
body:
  - type: input
    id: short_code
    attributes:
      label: Short Code (Folder Name)
      placeholder: "e.g., twitter-promo"
    validations:
      required: true
  - type: input
    id: target_url
    attributes:
      label: Target URL
      placeholder: "https://example.com/destination"
    validations:
      required: true
