name: Read Issue Data

on:
  issues:
    types: [opened]

jobs:
  process-issue:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants write access to commit files back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run script with issue data
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python addUrl.py "$ISSUE_TITLE"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated page from issue: ${{ github.event.issue.title }}" && git push)
